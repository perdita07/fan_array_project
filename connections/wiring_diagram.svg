<svg width="680" height="430" viewBox="0 0 680 430" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Per-fan wiring schematic for the fan array control system</title>
<desc>Shows how one fan connects to the SMPS power supply and Arduino Mega: SMPS supplies VCC/GND to the fan, the Arduino's PWM output drives the fan's control pin, and the fan's tachometer pin is pulled up to 5V through a 10 kilo-ohm resistor before feeding an Arduino interrupt pin.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="60" y="40" width="200" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="160" y="58" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#633806">Power supply</text>
<text x="160" y="76" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#854F0B">SMPS, 12V DC</text>

<rect x="420" y="40" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="520" y="58" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">Arduino Mega 2560</text>
<text x="520" y="76" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#534AB7">PWM out, interrupt in</text>

<rect x="230" y="170" width="220" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="188" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Fan (4-pin connector)</text>
<text x="340" y="206" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">GND, VCC, PWM, Tach</text>

<rect x="250" y="330" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="350" y="348" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#444441">10 kΩ pull-up</text>
<text x="350" y="366" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">Tach signal → +5V rail</text>

<path d="M160 96 L160 140 L290 140 L290 170" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="225" y="133" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444">VCC, GND</text>

<path d="M520 96 L520 140 L390 140 L390 170" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="455" y="133" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444">PWM signal</text>

<line x1="340" y1="226" x2="340" y2="330" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="352" y="280" text-anchor="start" font-family="sans-serif" font-size="12" fill="#444">Tach signal</text>

<path d="M450 358 L640 358 L640 68 L620 68" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="545" y="346" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444">To Arduino interrupt pin</text>
</svg>
